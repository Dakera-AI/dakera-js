name: Publish @dakera-ai/ai-sdk to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  publish-ai-sdk:
    name: Publish @dakera-ai/ai-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dakera-ai-sdk
        uses: actions/checkout@v7
        with:
          repository: Dakera-AI/dakera-ai-sdk
          ref: main
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
